services:
  - type: web
    name: amplygo
    runtime: node
    plan: free
    # devDependencies (typescript, tsx) are needed to build + seed, so force
    # them even when NODE_ENV=production would otherwise skip them.
    buildCommand: npm install --include=dev && npm run build
    startCommand: |
      export NEXTAUTH_URL="${NEXTAUTH_URL:-$RENDER_EXTERNAL_URL}"
      if [ "$SEED_ON_START" = "true" ]; then npm run seed || true; fi
      npm run start
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      # A strong secret is generated once and kept stable across deploys.
      - key: NEXTAUTH_SECRET
        generateValue: true
      # Supabase Postgres connection string — set in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      # Ensures the schema + demo accounts exist on boot (idempotent).
      - key: SEED_ON_START
        value: "true"
      # Admin login — set a strong password in the Render dashboard.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Optional OAuth — fill in the Render dashboard to enable Google/YouTube.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: INSTAGRAM_CLIENT_ID
        sync: false
      - key: INSTAGRAM_CLIENT_SECRET
        sync: false
