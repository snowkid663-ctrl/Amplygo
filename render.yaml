services:
  - type: web
    name: amplygo
    runtime: node
    plan: free
    # devDependencies (typescript, tsx) are needed to build + seed, so force
    # them even when NODE_ENV=production would otherwise skip them.
    buildCommand: npm install --include=dev && npm run build
    startCommand: |
      export NEXTAUTH_URL="${NEXTAUTH_URL:-$RENDER_EXTERNAL_URL}"
      if [ "$SEED_ON_START" = "true" ]; then npm run seed || true; fi
      npm run start
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      # A strong secret is generated once and kept stable across deploys.
      - key: NEXTAUTH_SECRET
        generateValue: true
      # Supabase Postgres connection string — set in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      # Ensures the schema + demo accounts exist on boot (idempotent).
      - key: SEED_ON_START
        value: "true"
      # Admin login — set a strong password in the Render dashboard.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Optional OAuth — fill in the Render dashboard to enable Google/YouTube.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: INSTAGRAM_CLIENT_ID
        sync: false
      - key: INSTAGRAM_CLIENT_SECRET
        sync: false
      # Real YouTube stats (Phase 1) — a YouTube Data API v3 key.
      - key: YOUTUBE_API_KEY
        sync: false
      # Shared secret so the stats cron can call the refresh endpoint.
      - key: CRON_SECRET
        sync: false

  # Scheduled job: refresh real video engagement stats (YouTube).
  - type: cron
    name: amplygo-refresh-stats
    runtime: node
    plan: free
    schedule: "0 */6 * * *" # every 6 hours
    buildCommand: npm install --include=dev
    startCommand: npm run refresh-stats
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: DATABASE_URL
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
